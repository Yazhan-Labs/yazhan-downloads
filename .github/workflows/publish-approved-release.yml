name: Publish approved Yazhan release

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Source app repository (Yazhan-Labs/name)
        required: true
        type: string
      source_run_id:
        description: Successful source Actions handoff run ID
        required: true
        type: string
      source_artifact_name:
        description: Exact source artifact name
        required: true
        type: string
      source_tag:
        description: Exact approved source app tag, for example v2.1.1
        required: true
        type: string
      source_commit:
        description: Exact approved 40-character source commit SHA
        required: true
        type: string
      release_tag:
        description: Public downloads release tag
        required: true
        type: string
      release_title:
        description: Public release title
        required: true
        type: string
      primary_asset:
        description: Primary customer-download asset filename
        required: true
        type: string
      primary_sha256:
        description: Expected SHA-256 of the primary asset
        required: true
        type: string
      owner_release_approval:
        description: Must be OWNER_APPROVED after fresh owner approval
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: public-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify handoff and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate release request
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ARTIFACT_NAME: ${{ inputs.source_artifact_name }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          PRIMARY_ASSET: ${{ inputs.primary_asset }}
          PRIMARY_SHA256: ${{ inputs.primary_sha256 }}
          OWNER_RELEASE_APPROVAL: ${{ inputs.owner_release_approval }}
          SOURCE_TOKEN: ${{ secrets.YAZHAN_SOURCE_ARTIFACT_READ_TOKEN }}
        run: |
          set -euo pipefail

          test "$OWNER_RELEASE_APPROVAL" = "OWNER_APPROVED" || { echo "Fresh owner release approval is required." >&2; exit 1; }
          [[ "$SOURCE_REPOSITORY" =~ ^Yazhan-Labs/[A-Za-z0-9_.-]+$ ]] || { echo "Invalid source repository." >&2; exit 1; }
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid source run ID." >&2; exit 1; }
          [[ "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid source tag." >&2; exit 1; }
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Invalid source commit SHA." >&2; exit 1; }
          [[ "$RELEASE_TAG" =~ ^yazhan-[a-z0-9-]+-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid public release tag." >&2; exit 1; }
          [[ "$PRIMARY_ASSET" != */* && "$PRIMARY_ASSET" != *\\* && "$PRIMARY_ASSET" != .* ]] || { echo "Invalid primary asset filename." >&2; exit 1; }
          [[ "$PRIMARY_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "Invalid primary SHA-256." >&2; exit 1; }
          test -n "$RELEASE_TITLE" || { echo "Release title is required." >&2; exit 1; }
          test -n "$SOURCE_ARTIFACT_NAME" || { echo "Source artifact name is required." >&2; exit 1; }
          test -n "$SOURCE_TOKEN" || { echo "YAZHAN_SOURCE_ARTIFACT_READ_TOKEN is required." >&2; exit 1; }

      - name: Verify source handoff run and receipt
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.YAZHAN_SOURCE_ARTIFACT_READ_TOKEN }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          PRIMARY_SHA256: ${{ inputs.primary_sha256 }}
        run: |
          set -euo pipefail

          run_json="$(gh api "repos/${SOURCE_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
          run_repository="$(jq -r '.repository.full_name // empty' <<<"$run_json")"
          event="$(jq -r '.event // empty' <<<"$run_json")"
          workflow_path="$(jq -r '.path // empty' <<<"$run_json")"

          test "$conclusion" = "success" || { echo "Source handoff workflow run is not successful." >&2; exit 1; }
          test "$run_repository" = "$SOURCE_REPOSITORY" || { echo "Source handoff run repository mismatch." >&2; exit 1; }
          test "$event" = "workflow_dispatch" || { echo "Source handoff run must be an explicit workflow_dispatch." >&2; exit 1; }
          test "$workflow_path" = ".github/workflows/release-handoff-artifact.yml" || { echo "Unexpected source handoff workflow path." >&2; exit 1; }

          jobs_json="$(gh api "repos/${SOURCE_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100")"
          handoff_job_id="$(jq -r '[.jobs[] | select(.name == "create-handoff-artifact" and .conclusion == "success")] | first | .id // empty' <<<"$jobs_json")"
          test -n "$handoff_job_id" || { echo "Successful create-handoff-artifact job was not found." >&2; exit 1; }

          gh api --allow-escape-sequences "repos/${SOURCE_REPOSITORY}/actions/jobs/${handoff_job_id}/logs" > source-handoff.log

          grep -F "SOURCE RELEASE HANDOFF: PASS" source-handoff.log >/dev/null || { echo "Source handoff PASS receipt is missing." >&2; exit 1; }
          grep -F "Tag: ${SOURCE_TAG}" source-handoff.log >/dev/null || { echo "Source handoff tag receipt mismatch." >&2; exit 1; }
          grep -F "Commit: ${SOURCE_COMMIT}" source-handoff.log >/dev/null || { echo "Source handoff commit receipt mismatch." >&2; exit 1; }
          grep -Fi "Installer SHA-256: ${PRIMARY_SHA256}" source-handoff.log >/dev/null || { echo "Source handoff installer hash receipt mismatch." >&2; exit 1; }
          grep -F "No Yazhan Downloads publication was attempted." source-handoff.log >/dev/null || { echo "Source handoff no-publication receipt is missing." >&2; exit 1; }

          echo "Source handoff Actions provenance verified for ${SOURCE_TAG} / ${SOURCE_COMMIT}."

      - name: Download exact validated release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_artifact_name }}
          path: release-input
          github-token: ${{ secrets.YAZHAN_SOURCE_ARTIFACT_READ_TOKEN }}
          repository: ${{ inputs.source_repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Verify release package and hashes
        shell: bash
        env:
          PRIMARY_ASSET: ${{ inputs.primary_asset }}
          PRIMARY_SHA256: ${{ inputs.primary_sha256 }}
        run: |
          set -euo pipefail
          cd release-input

          test -f RELEASE_NOTES.md || { echo "RELEASE_NOTES.md is missing." >&2; exit 1; }
          test -f SHA256SUMS.txt || { echo "SHA256SUMS.txt is missing." >&2; exit 1; }
          test -f "$PRIMARY_ASSET" || { echo "Primary release asset is missing." >&2; exit 1; }

          if find . -mindepth 1 -maxdepth 1 -type l -print -quit | grep -q .; then
            echo "Symlinks are not allowed in release packages." >&2
            exit 1
          fi

          mapfile -t public_assets < <(find . -mindepth 1 -maxdepth 1 -type f ! -name 'RELEASE_NOTES.md' ! -name 'SHA256SUMS.txt' -printf '%f\n' | sort)
          test "${#public_assets[@]}" -gt 0 || { echo "No public release assets found." >&2; exit 1; }

          for asset in "${public_assets[@]}"; do
            expected="$(tr -d '\r' < SHA256SUMS.txt | awk -v name="$asset" 'tolower($2)==tolower(name) {print tolower($1)}' | head -n1)"
            test -n "$expected" || { echo "SHA256SUMS.txt has no entry for $asset." >&2; exit 1; }
            actual="$(sha256sum "$asset" | awk '{print tolower($1)}')"
            test "$actual" = "$expected" || { echo "SHA-256 mismatch for $asset." >&2; exit 1; }
            echo "Verified $asset / $actual"
          done

          actual_primary="$(sha256sum "$PRIMARY_ASSET" | awk '{print tolower($1)}')"
          test "$actual_primary" = "${PRIMARY_SHA256,,}" || { echo "Primary asset hash does not match approved handoff." >&2; exit 1; }

      - name: Fail closed if public tag or release already exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Public release already exists; refusing replacement." >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Public tag already exists; refusing retagging." >&2
            exit 1
          fi

      - name: Publish public release from validated package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TITLE: ${{ inputs.release_title }}
        run: |
          set -euo pipefail
          cd release-input
          mapfile -t upload_files < <(find . -mindepth 1 -maxdepth 1 -type f ! -name 'RELEASE_NOTES.md' -printf '%f\n' | sort)
          gh release create "$RELEASE_TAG" "${upload_files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TITLE" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag=false

      - name: Verify published bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p published-check
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir published-check

          cd release-input
          mapfile -t upload_files < <(find . -mindepth 1 -maxdepth 1 -type f ! -name 'RELEASE_NOTES.md' -printf '%f\n' | sort)
          for file in "${upload_files[@]}"; do
            test -f "../published-check/$file" || { echo "Published asset missing: $file" >&2; exit 1; }
            local_hash="$(sha256sum "$file" | awk '{print tolower($1)}')"
            public_hash="$(sha256sum "../published-check/$file" | awk '{print tolower($1)}')"
            test "$local_hash" = "$public_hash" || { echo "Published asset hash mismatch: $file" >&2; exit 1; }
          done

          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,name,tagName,isDraft,isPrerelease
          echo "Public release publication and byte verification complete."
