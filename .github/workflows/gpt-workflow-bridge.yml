name: GPT Workflow Bridge

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: gpt-workflow-bridge-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: ${{ github.event.issue.pull_request == null && startsWith(github.event.comment.body, '/yl-run ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Authorize controller command
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ACTOR: ${{ github.event.comment.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          set -euo pipefail

          test "$ISSUE_TITLE" = "GPT Workflow Controller — GPTs dispatch here" || {
            echo "Bridge commands are accepted only on the canonical controller issue." >&2
            exit 1
          }

          permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${ACTOR}/permission" --jq '.permission' 2>/dev/null || true)"

          case "$permission" in
            admin|maintain|write) ;;
            *)
              case "$AUTHOR_ASSOCIATION" in
                OWNER|MEMBER|COLLABORATOR) ;;
                *)
                  echo "Actor is not authorized to dispatch repository workflows." >&2
                  exit 1
                  ;;
              esac
              ;;
          esac

          echo "Authorized workflow command from ${ACTOR}."

      - name: Parse and validate command
        id: command
        shell: bash
        env:
          COMMAND_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import re

          body = os.environ['COMMAND_BODY'].replace('\r\n', '\n').replace('\r', '\n').strip()
          lines = [line.strip() for line in body.split('\n') if line.strip()]
          if not lines:
              raise SystemExit('Empty bridge command.')

          match = re.fullmatch(r'/yl-run ([A-Za-z0-9_.-]+\.ya?ml)', lines[0])
          if not match:
              raise SystemExit('Invalid /yl-run command header.')

          workflow = match.group(1)
          if workflow == 'gpt-workflow-bridge.yml':
              raise SystemExit('The bridge cannot dispatch itself.')

          values = {}
          for line in lines[1:]:
              if '=' not in line:
                  raise SystemExit(f'Invalid command line: {line}')
              key, value = line.split('=', 1)
              key = key.strip()
              value = value.strip()
              if not re.fullmatch(r'[A-Za-z0-9_-]+', key):
                  raise SystemExit(f'Invalid input name: {key}')
              if key in values:
                  raise SystemExit(f'Duplicate command field: {key}')
              if not value:
                  raise SystemExit(f'Empty value for: {key}')
              if len(value) > 500:
                  raise SystemExit(f'Value too long for: {key}')
              values[key] = value

          ref = values.pop('ref', None)
          if not ref or not re.fullmatch(r'[A-Za-z0-9._/-]+', ref):
              raise SystemExit('A valid ref=... line is required.')

          payload = {'ref': ref, 'inputs': values}
          with open('dispatch.json', 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, ensure_ascii=False)

          output = os.environ['GITHUB_OUTPUT']
          with open(output, 'a', encoding='utf-8') as handle:
              handle.write(f'workflow={workflow}\n')
              handle.write(f'ref={ref}\n')

          print(f'Validated workflow: {workflow}')
          print(f'Validated ref: {ref}')
          print(f'Validated input count: {len(values)}')
          PY

      - name: Verify target workflow exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ steps.command.outputs.workflow }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW}" --jq '.path'

      - name: Dispatch target workflow
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ steps.command.outputs.workflow }}
          REF: ${{ steps.command.outputs.ref }}
        run: |
          set -euo pipefail

          started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "started_at=${started_at}" >> "$GITHUB_OUTPUT"

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW}/dispatches" \
            --input dispatch.json

          echo "Dispatched ${WORKFLOW} on ${REF}."

      - name: Find dispatched run and acknowledge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ steps.command.outputs.workflow }}
          REF: ${{ steps.command.outputs.ref }}
          STARTED_AT: ${{ steps.dispatch.outputs.started_at }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          run_id=""
          run_url=""
          for attempt in $(seq 1 20); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW}/runs?event=workflow_dispatch&branch=${REF}&per_page=20")"
            run_id="$(jq -r --arg started "$STARTED_AT" '[.workflow_runs[] | select(.created_at >= $started)] | sort_by(.created_at) | last | .id // empty' <<<"$runs")"
            run_url="$(jq -r --arg started "$STARTED_AT" '[.workflow_runs[] | select(.created_at >= $started)] | sort_by(.created_at) | last | .html_url // empty' <<<"$runs")"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 2
          done

          if [ -n "$run_id" ]; then
            body="GPT Workflow Bridge: dispatched \`${WORKFLOW}\` on \`${REF}\`. Run: ${run_url} (ID \`${run_id}\`)."
          else
            body="GPT Workflow Bridge: dispatch accepted for \`${WORKFLOW}\` on \`${REF}\`. Run discovery is still pending."
          fi

          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
          echo "$body"
