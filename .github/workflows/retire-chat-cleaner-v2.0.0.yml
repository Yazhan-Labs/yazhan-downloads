name: Retire superseded Chat Cleaner 2.0.0

on:
  workflow_dispatch:
    inputs:
      owner_destructive_approval:
        description: Exact owner approval token for this one retirement
        required: true
        type: string

permissions:
  contents: write

jobs:
  retire:
    name: Delete only superseded Chat Cleaner 2.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate exact destructive scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL: ${{ inputs.owner_destructive_approval }}
        run: |
          set -euo pipefail
          test "$APPROVAL" = "OWNER_APPROVED_DELETE_CHAT_CLEANER_V2_0_0" || {
            echo "Exact owner destructive approval is required." >&2
            exit 1
          }

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/yazhan-chat-cleaner-v2.1.1" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/yazhan-whatsapp-approved-batch-assistant-v3.0.1" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/chat-cleaner-v2.0.0" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/chat-cleaner-v2.0.0" >/dev/null

      - name: Delete superseded release and tag only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/chat-cleaner-v2.0.0" --jq '.id')"
          test -n "$release_id"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/chat-cleaner-v2.0.0"

      - name: Verify retirement and retained current releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/chat-cleaner-v2.0.0" >/dev/null 2>&1; then
            echo "Old Chat Cleaner 2.0.0 release still exists." >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/chat-cleaner-v2.0.0" >/dev/null 2>&1; then
            echo "Old Chat Cleaner 2.0.0 tag still exists." >&2
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/yazhan-chat-cleaner-v2.1.1" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/yazhan-whatsapp-approved-batch-assistant-v3.0.1" >/dev/null

          echo "SUPERSEDED RELEASE RETIREMENT: PASS"
          echo "Deleted release: chat-cleaner-v2.0.0"
          echo "Deleted tag: chat-cleaner-v2.0.0"
          echo "Retained: yazhan-chat-cleaner-v2.1.1"
          echo "Retained: yazhan-whatsapp-approved-batch-assistant-v3.0.1"

      - name: Record durable retirement continuity
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update project continuity
        shell: python
        run: |
          from pathlib import Path
          from datetime import date

          p = Path('PROJECT_MASTER.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('Last updated: 2026-08-26', 'Last updated: 2026-08-28', 1)
          text = text.replace(
              '- Do not delete existing releases.',
              '- Do not delete existing releases unless the owner gives fresh explicit approval for an exact superseded-release retirement. Owner-approved exception on 2026-08-28 retired Chat Cleaner 2.0.0 release/tag while retaining Chat Cleaner 2.1.1 and WhatsApp Approved Batch Assistant 3.0.1.',
              1,
          )
          section = '''\n\n## Superseded public release retirement — 2026-08-28\n\n- Owner instruction: keep only the latest uploaded public version of WhatsApp Approved Batch Assistant and Yazhan Chat Cleaner so superseded installers cannot be downloaded.\n- Fresh destructive approval: received in the project conversation on 2026-08-28.\n- Scope resolved from current GitHub truth: no older WABAA public release existed; Chat Cleaner 2.0.0 was the only superseded public release.\n- Deleted public release: `chat-cleaner-v2.0.0` (Yazhan Chat Cleaner v2.0.0).\n- Deleted Git tag: `chat-cleaner-v2.0.0`.\n- Retained current Chat Cleaner release: `yazhan-chat-cleaner-v2.1.1`.\n- Retained current WABAA release: `yazhan-whatsapp-approved-batch-assistant-v3.0.1`.\n- Result: `SUPERSEDED RELEASE RETIREMENT: PASS`.\n- This is a specific owner-approved exception to the normal no-release-deletion guardrail; it is not blanket permission for future destructive release changes.\n'''
          if '## Superseded public release retirement — 2026-08-28' not in text:
              text += section
          p.write_text(text, encoding='utf-8')

      - name: Commit continuity receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_MASTER.md
          if git diff --cached --quiet; then
            echo "No continuity change required."
          else
            git commit -m "docs: record superseded release retirement"
            git push origin HEAD:main
          fi
